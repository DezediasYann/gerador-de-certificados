[package]
name = "gerador-de-certificados"
version = "1.2.4"
description = "Gerador de Certificados — crie certificados em PDF a partir de modelos"
authors = ["Yann Dezedias"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "gerador_de_certificados_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# default-features = false evita o crate `zip` 2.x (yanked do crates.io).
# rustls-tls + system-proxy cobrem o download de atualizações sem dependências problemáticas.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Por padrão, usa custom protocol (produção). Para dev, o Tauri CLI injeta a flag.
custom-protocol = ["tauri/custom-protocol"]
