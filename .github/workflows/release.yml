name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-tauri:
    permissions:
      contents: write
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # ━━ Cache do Bun (node_modules) ━━
      # Acelera o `bun install` — pula download de deps quando o bun.lockb não mudou.
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'package.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ━━ Cache do Cargo (Rust) ━━
      # A compilação Rust é a parte mais lenta do build (~15-30 min sem cache).
      # Com cache: ~3-5 min. O Swatinem/rust-cache lida com ~/.cargo/registry,
      # ~/.cargo/git e src-tauri/target automaticamente, com hash do Cargo.lock.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # ━━ Normalizar a chave privada para base64 puro ━━
      # O secret pode estar em um de dois formatos:
      #   1. Base64 puro (uma linha) — usar direto
      #   2. Conteúdo cru multi-linha (formato minisign, começa com "untrusted comment:")
      #      — codificar em base64
      # Este step detecta qual é e normaliza para base64 puro.
      - name: Normalizar chave privada para base64 (Unix)
        if: runner.os != 'Windows'
        env:
          SK: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if echo "$SK" | grep -q "^untrusted comment:"; then
            # É formato cru (multi-linha) → codificar em base64
            KEY_BASE64=$(printf '%s' "$SK" | base64 | tr -d '\n')
            echo "Chave em formato cru detectada → convertida para base64"
          else
            # Já é base64 → usar direto
            KEY_BASE64=$(printf '%s' "$SK" | tr -d '\n')
            echo "Chave já em base64 → usada diretamente"
          fi
          echo "TAURI_SIGNING_PRIVATE_KEY_B64=$KEY_BASE64" >> $GITHUB_ENV

      - name: Normalizar chave privada para base64 (Windows)
        if: runner.os == 'Windows'
        env:
          SK: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $sk = $env:SK
          if ($sk -match "^untrusted comment:") {
            $bytes = [System.Text.Encoding]::UTF8.GetBytes($sk)
            $b64 = [System.Convert]::ToBase64String($bytes)
            Write-Host "Chave em formato cru detectada → convertida para base64"
          } else {
            $b64 = $sk -replace "`n", "" -replace "`r", ""
            Write-Host "Chave já em base64 → usada diretamente"
          }
          echo "TAURI_SIGNING_PRIVATE_KEY_B64=$b64" >> $env:GITHUB_ENV
        shell: pwsh

      # ━━ Validação da chave: assina um arquivo de teste ━━
      # Falha cedo (~10s) se a senha ou a chave estiverem erradas.
      # Usa um caminho de arquivo cross-platform (não /tmp, que não existe no Windows).
      - name: Validar chave de assinatura
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          echo "teste-de-chave" > tauri-key-test.txt
          bun run tauri signer sign tauri-key-test.txt
          if [ $? -ne 0 ]; then
            echo "❌ Falha ao assinar com a chave privada. Verifique:"
            echo "   - O secret TAURI_SIGNING_PRIVATE_KEY tem o conteúdo do arquivo .key (em base64)"
            echo "   - O secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD tem a senha correta"
            rm -f tauri-key-test.txt tauri-key-test.txt.sig
            exit 1
          fi
          echo "✅ Chave privada e senha validadas com sucesso."
          rm -f tauri-key-test.txt tauri-key-test.txt.sig
        shell: bash

      # ━━ Extrair changelog da versão atual do CHANGELOG.md ━━
      # Lê o arquivo CHANGELOG.md, encontra a seção "## [vX.Y.Z]" correspondente
      # à tag atual e salva em $GITHUB_ENV para usar como releaseBody.
      - name: Extrair changelog da versão
        run: |
          TAG="${{ github.ref_name }}"
          echo "Tag atual: $TAG"
          if [ ! -f CHANGELOG.md ]; then
            echo "⚠️ CHANGELOG.md não encontrado — usando body padrão"
            echo "RELEASE_BODY=Veja as mudanças em https://github.com/DezediasYann/gerador-de-certificados/blob/main/CHANGELOG.md" >> $GITHUB_ENV
            exit 0
          fi
          # Extrai da linha "## [vX.Y.Z]" até o próximo "## [" (exclusive)
          # Usa index() (string match) em vez de regex para evitar problemas com []
          BODY=$(awk -v tag="## [${TAG}]" '
            index($0, tag) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            echo "⚠️ Seção ${TAG} não encontrada no CHANGELOG.md — usando body padrão"
            echo "RELEASE_BODY=Veja as mudanças em https://github.com/DezediasYann/gerador-de-certificados/blob/main/CHANGELOG.md" >> $GITHUB_ENV
          else
            echo "✅ Changelog de ${TAG} extraído (${#BODY} caracteres)"
            # Usa delimitador especial para preservar newlines no GITHUB_ENV
            echo "RELEASE_BODY<<CHANGELOG_EOF" >> $GITHUB_ENV
            echo "$BODY" >> $GITHUB_ENV
            echo "CHANGELOG_EOF" >> $GITHUB_ENV
          fi
        shell: bash

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY_B64 }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Gerador de Certificados ${{ github.ref_name }}"
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.platform == 'ubuntu-22.04' && '--target x86_64-unknown-linux-gnu' || '' }}
